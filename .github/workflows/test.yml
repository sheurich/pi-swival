---
name: test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    env:
      NONO_NO_UPDATE_CHECK: "1"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install selected Pi host
        run: npm install -g @earendil-works/pi-coding-agent@1.2.0 --ignore-scripts --no-audit --no-fund

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: '0.12.19'
          python-version: '3.13'
          enable-cache: false

      - name: Install Python 3.13
        run: uv --no-config python install 3.13

      - name: Bootstrap offline test dependencies
        run: ./tests/setup.sh

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Typecheck against selected Pi peers
        run: npm run typecheck

      - name: Vitest
        run: npm test

  agentfs:
    # AgentFS 0.6.4 needs unprivileged mount namespaces, which Ubuntu 24.04
    # blocks through its default AppArmor policy.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      NONO_NO_UPDATE_CHECK: "1"
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: '22.19.0'

      - name: Install selected Pi host
        run: npm install -g @earendil-works/pi-coding-agent@1.2.0 --ignore-scripts --no-audit --no-fund

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: '0.12.19'
          python-version: '3.13'
          enable-cache: false

      - name: Install Python 3.13
        run: uv --no-config python install 3.13

      - name: Bootstrap offline test dependencies
        run: ./tests/setup.sh

      - name: Install pinned AgentFS
        env:
          AGENTFS_VERSION: v0.6.4
          AGENTFS_TRIPLE: x86_64-unknown-linux-gnu
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/tursodatabase/agentfs/releases/download/${AGENTFS_VERSION}"
          archive="agentfs-${AGENTFS_TRIPLE}.tar.xz"
          curl -fsSLO "${base}/${archive}"
          sha256='ba314bd58262ca355e16afc3ecf405cfd934995b15af231d32a0426b72d74700'
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
          tar -xJf "$archive"
          install -D -m 0755 "agentfs-${AGENTFS_TRIPLE}/agentfs" "$HOME/.local/bin/agentfs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned nono
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          archive="nono-v0.80.0-x86_64-unknown-linux-gnu.tar.gz"
          base="https://github.com/nolabs-ai/nono/releases/download/v0.80.0"
          curl -fsSLO "${base}/${archive}"
          sha256='6da665b61999570c10dffc7da78828fe1fb7f3cac53319e505cebecaef17037f'
          printf '%s  %s\n' "$sha256" "$archive" | sha256sum -c -
          tar -xzf "$archive"
          install -D -m 0755 nono "$HOME/.local/bin/nono"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: AgentFS integration canary
        env:
          REQUIRE_AGENTFS: "1"
        run: npm run agentfs-integration

      - name: Native AgentFS integration
        run: npm run native-agentfs-integration

  ci:
    needs: [test, agentfs]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require all CI jobs to succeed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          AGENTFS_RESULT: ${{ needs.agentfs.result }}
        run: |
          [[ "$TEST_RESULT" == "success" && "$AGENTFS_RESULT" == "success" ]]
