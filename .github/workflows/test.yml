---
name: test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20', '22']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Pi globally
        env:
          PI_VERSION: ${{ matrix.node-version == '20' && 'legacy-node20' || 'latest' }}
        run: npm install -g "@earendil-works/pi-coding-agent@$PI_VERSION"

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Vitest
        run: npm test

  agentfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install pinned AgentFS
        env:
          AGENTFS_VERSION: v0.6.4
          AGENTFS_TRIPLE: x86_64-unknown-linux-gnu
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/tursodatabase/agentfs/releases/download/${AGENTFS_VERSION}"
          archive="agentfs-${AGENTFS_TRIPLE}.tar.xz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/sha256.sum"
          grep " ${archive}\$" sha256.sum | sha256sum -c -
          tar -xJf "$archive"
          install -D -m 0755 "agentfs-${AGENTFS_TRIPLE}/agentfs" "$HOME/.local/bin/agentfs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: AgentFS integration canary
        env:
          REQUIRE_AGENTFS: "1"
        run: npm run agentfs-integration
