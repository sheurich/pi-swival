---
name: test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Pi 1.0.4 globally
        run: npm install --ignore-scripts -g "@earendil-works/pi-coding-agent@1.0.4"

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: '0.12.19'
          python-version: '3.13'
          enable-cache: false

      - name: Bootstrap offline test dependencies
        run: ./tests/setup.sh

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Typecheck against selected Pi peers
        run: npm run typecheck

      - name: Vitest
        run: npm test

  agentfs:
    # AgentFS 0.6.4 needs unprivileged mount namespaces, which Ubuntu 24.04
    # blocks through its default AppArmor policy.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Install pinned AgentFS
        env:
          AGENTFS_VERSION: v0.6.4
          AGENTFS_TRIPLE: x86_64-unknown-linux-gnu
        run: |
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cd "$work"
          base="https://github.com/tursodatabase/agentfs/releases/download/${AGENTFS_VERSION}"
          archive="agentfs-${AGENTFS_TRIPLE}.tar.xz"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/sha256.sum"
          grep " \*${archive}\$" sha256.sum | sha256sum -c -
          tar -xJf "$archive"
          install -D -m 0755 "agentfs-${AGENTFS_TRIPLE}/agentfs" "$HOME/.local/bin/agentfs"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: AgentFS integration canary
        env:
          REQUIRE_AGENTFS: "1"
        run: npm run agentfs-integration
